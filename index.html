<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedigree</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0E6E6B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pedigree">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --bg:#E4EAEC; --surface:#FFFFFF; --surface2:#F3F6F7; --ink:#18212E; --muted:#5B6676; --rule:#CFD7DC;
  --accent:#0E6E6B; --accent-ink:#FFFFFF; --accent-soft:#DCEFEC;
  --ok:#2E6B3B; --warn:#93570A; --err:#A3322B; --fix:#3D5A99;
  --sheet:#FBFCFC; --grid:#E8EEF0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1418; --surface:#182027; --surface2:#1E272F; --ink:#E4E9ED; --muted:#98A3AF; --rule:#2B353E;
    --accent:#45B3AB; --accent-ink:#06201F; --accent-soft:#16312F;
    --ok:#7CC48A; --warn:#E0A54A; --err:#F08A80; --fix:#93A9E0;
    --sheet:#F4F7F7; --grid:#E3E9EB;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1418; --surface:#182027; --surface2:#1E272F; --ink:#E4E9ED; --muted:#98A3AF; --rule:#2B353E;
  --accent:#45B3AB; --accent-ink:#06201F; --accent-soft:#16312F;
  --ok:#7CC48A; --warn:#E0A54A; --err:#F08A80; --fix:#93A9E0;
  --sheet:#F4F7F7; --grid:#E3E9EB;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;letter-spacing:.01em;white-space:nowrap}
.brand svg{flex:none}
#code{flex:1;min-width:0;max-width:260px;border:1px solid var(--rule);background:var(--surface2);border-radius:8px;padding:6px 10px;font-size:14px}
#code::placeholder{color:var(--muted)}
.hbtns{margin-left:auto;display:flex;gap:4px;position:relative}
.icon{width:38px;height:38px;border:1px solid transparent;border-radius:9px;background:transparent;display:grid;place-items:center;color:var(--ink)}
.icon:hover:not(:disabled){background:var(--surface2);border-color:var(--rule)}
.icon:disabled{opacity:.35;cursor:default}
#menu{position:absolute;right:0;top:44px;z-index:30;background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:0 10px 30px rgba(10,20,30,.18);padding:6px;min-width:220px;display:flex;flex-direction:column}
#menu button{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:8px}
#menu button:hover{background:var(--surface2)}
#menu hr{border:0;border-top:1px solid var(--rule);margin:4px 2px}
body.nodl .dl{display:none}

/* stage: the drawing sheet */
#stagewrap{position:relative;min-height:0;overflow:hidden}
#stage{position:absolute;inset:0;overflow:auto;background:var(--bg);padding:12px;touch-action:pan-x pan-y}
#sheet{display:inline-block;min-width:100%;min-height:100%;background-color:var(--sheet);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;border:1px solid var(--rule);border-radius:4px;padding:6px;text-align:left;vertical-align:top}
#sheet svg{display:block;margin:0 auto}
#legend{position:sticky;left:0;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:6px 12px;margin:-4px 0 8px;font-size:13px;width:max-content;max-width:100%;padding:6px 10px;background:var(--surface);border:1px solid var(--rule);border-radius:8px}
.lgi{display:inline-flex;align-items:center;gap:6px}
.pmanote{flex-basis:100%;color:var(--ink);cursor:pointer}
.pmanote b{font-size:10.5px;color:#6B3E75;border:1px solid #6B3E75;border-radius:999px;padding:0 6px;margin-right:4px}
.lgi i{width:12px;height:12px;display:inline-block;border-radius:2px}
.zoom{position:absolute;right:12px;bottom:12px;z-index:5;display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:3px}
.zoom button{width:34px;height:32px;border:0;background:transparent;border-radius:7px;font-size:18px;line-height:1}
.zoom button:hover{background:var(--surface2)}
.zoom #zfit{width:auto;padding:0 10px;font-size:13px}
#zoomval{font-size:12px;color:var(--muted);min-width:40px;text-align:center}
#emptyhint{position:absolute;left:50%;top:58%;transform:translateX(-50%);width:min(420px,86%);color:#3E4A58;font-size:15px;text-align:center;pointer-events:none}
#emptyhint p{margin:0 0 6px}
#emptyhint em{display:block;font-style:normal;color:#0E6E6B;font-size:14px}

/* panel */
#panel{background:var(--surface);border-top:1px solid var(--rule);display:flex;flex-direction:column;min-height:0}
#composer{display:flex;gap:8px;align-items:flex-end;padding:10px 12px 12px}
#cmd{flex:1;min-width:0;resize:none;border:1.5px solid var(--rule);border-radius:12px;padding:10px 12px;background:var(--surface2);min-height:46px;max-height:140px;line-height:1.35}
#cmd:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.send{height:46px;padding:0 18px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.tools{display:flex;gap:6px;padding:0 12px}
.chipbtn{border:1px solid var(--rule);background:var(--surface2);border-radius:999px;padding:5px 12px;font-size:13px}
#examples{display:none;flex-wrap:wrap;gap:6px;padding:8px 12px 0}
#examples.show{display:flex}
#examples button{border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;text-align:left}
#examples button:hover{border-color:var(--accent)}
#log{overflow:auto;padding:4px 12px 0;font-size:13.5px}
.entry{padding:8px 0;border-bottom:1px solid var(--rule)}
.entry .cmd{color:var(--muted);font-size:12.5px;margin-bottom:3px;overflow-wrap:anywhere}
.it{display:flex;gap:7px;align-items:flex-start;padding:1px 0}
.it b{width:14px;flex:none;text-align:center}
.it.ok b{color:var(--ok)} .it.warn b{color:var(--warn)} .it.err b{color:var(--err)} .it.fix b{color:var(--fix)}
.it.err span{color:var(--err)} .it.fix span{color:var(--fix)}
.lognote{color:var(--muted);margin:6px 0}

/* mobile: only latest entry unless expanded */
@media (max-width:959px){
  #panel{order:3}
  #log{max-height:6.8em;padding-top:6px}
  #log .entry:not(.latest){display:none}
  #log .entry{border-bottom:0;padding:2px 0}
  #panel.logopen #log{max-height:42vh}
  #panel.logopen #log .entry{display:block;border-bottom:1px solid var(--rule);padding:8px 0}
  #panel .tools{padding-top:6px}
  .brand span{display:none}
}
@media (min-width:960px){
  .app{grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr)}
  header{grid-column:1/-1}
  #stagewrap{grid-row:2;grid-column:1}
  #panel{grid-row:2;grid-column:2;border-top:0;border-left:1px solid var(--rule)}
  #composer{order:1;flex-direction:column;align-items:stretch;padding:14px 16px 8px}
  #cmd{min-height:84px}
  .send{align-self:flex-end}
  .tools{order:2;padding:0 16px}
  #logbtn{display:none}
  #examples{order:3;padding:8px 16px 4px;max-height:40vh;overflow:auto}
  #examples.show{display:flex}
  #log{order:4;flex:1;padding:4px 16px 16px;border-top:1px solid var(--rule);margin-top:8px}
}

/* editor sheet */
#scrim{position:fixed;inset:0;background:rgba(8,14,20,.32);z-index:20}
#editor{position:fixed;z-index:21;left:0;right:0;bottom:0;max-height:82%;overflow:auto;background:var(--surface);border-radius:16px 16px 0 0;border:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 40px rgba(8,14,20,.2)}
@media (min-width:700px){#editor{left:auto;right:16px;bottom:16px;top:72px;width:420px;max-height:none;border-radius:14px}}
#editor.open{animation:rise .18s ease-out}
@keyframes rise{from{transform:translateY(14px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#editor.open{animation:none}}
.edhead{position:sticky;top:0;background:var(--surface);display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--rule)}
.edid{font-weight:700;font-size:18px}
.tag{margin-left:8px;font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 9px;vertical-align:3px}
.ghost{border:1px solid var(--rule);background:transparent;border-radius:8px;padding:6px 12px}
.edbody{padding:12px 16px 18px;display:flex;flex-direction:column;gap:12px}
.edbody label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.edbody input:not([type=checkbox]){border:1px solid var(--rule);background:var(--surface2);border-radius:8px;padding:8px 10px;font-size:15px;color:var(--ink);min-width:0}
.edbody input:disabled{opacity:.5}
.edbody label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:end}
.grid2>label{min-width:0}
.edbody label>input:not([type=checkbox]){width:100%}
.addc input{width:auto}
.addc #f-newc{flex:1;min-width:0}
.addc .cage{width:72px;flex:none}
.crow .cage{width:72px;flex:none}
.g3s{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.g3s label{font-size:12px}
.edbody textarea{border:1px solid var(--rule);background:var(--surface2);border-radius:8px;padding:8px 10px;font-size:14px;color:var(--ink);width:100%;resize:vertical}
.pmatag{background:#F3EEFA!important;color:#6B3E75!important}
.crow select{border:1px solid var(--rule);background:var(--surface2);border-radius:8px;padding:6px;font-size:13.5px;color:var(--ink)}
.vtxt{font-weight:700;color:var(--ink)}
.row3{display:flex;gap:18px;flex-wrap:wrap}
.segs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.seg{border:0;background:var(--surface2);padding:9px 4px;font-size:14px}
.seg+.seg{border-left:1px solid var(--rule)}
.seg.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.blk{border:1px solid var(--rule);border-radius:10px;padding:10px}
.blkt{font-size:13px;color:var(--muted);margin-bottom:6px}
.crow{display:flex;align-items:center;gap:8px;padding:4px 0}
.crow .cn{flex:1;min-width:0;overflow-wrap:anywhere}
.cage{width:72px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.sw{width:22px;height:22px;border-radius:5px;border:1px solid rgba(0,0,0,.15);flex:none}
.x{border:0;background:transparent;font-size:20px;line-height:1;color:var(--muted);width:28px}
.addc{display:flex;gap:6px;margin-top:6px}
.addc input:first-child{flex:1}
.small{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:8px;padding:6px 10px;font-size:13px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.quick button{border:1px solid var(--rule);background:var(--surface2);border-radius:8px;padding:8px 4px;font-size:13.5px}
.quick button:hover{border-color:var(--accent)}
.danger{border:1px solid var(--err);color:var(--err);background:transparent;border-radius:10px;padding:10px}
.note{color:var(--muted);margin:0;font-size:13px}
.err{color:var(--err);margin:0;font-size:13.5px}
/* scheda: famiglia, gemelli, legami */
.fam .famrow{display:flex;gap:8px;align-items:flex-start;margin:4px 0 6px}
.fam .fl{font-size:12.5px;color:var(--muted);width:62px;flex:none;padding-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--surface2);border-radius:999px;padding:5px 11px;font-size:13px}
.fchip i{width:10px;height:10px;border-radius:2px;display:inline-block}
.fchip.on{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.vlist{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.vrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;justify-content:space-between}
.vrow .vtxt{font-weight:700;font-size:13.5px;overflow-wrap:anywhere}
.zbs{display:inline-flex;border:1px solid var(--rule);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.zbs.wide{display:flex}.zbs.wide .zb{flex:1}
.zb{border:0;background:var(--surface2);padding:6px 9px;font-size:12.5px}
.zb+.zb{border-left:1px solid var(--rule)}
.zb.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.likepb{margin:2px 0 4px 70px}
.pick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 6px 70px;font-size:13px;color:var(--warn)}
details.blk>summary{cursor:pointer;list-style:none;margin:0}
details.blk>summary::before{content:'▸ ';color:var(--muted)}
details.blk[open]>summary::before{content:'▾ '}
details.blk[open]>summary{margin-bottom:8px}
.urow{display:flex;flex-direction:column;gap:5px;padding:6px 0;border-bottom:1px dashed var(--rule)}
.urow .ut{font-size:13.5px}
.edbody select{border:1px solid var(--rule);background:var(--surface2);border-radius:8px;padding:7px;font-size:14px;color:var(--ink);min-width:0}
.addc select{flex:1}
/* domande di chiarimento nel registro */
.ask{margin:6px 0 2px;padding:8px 10px;border:1px solid #E7C27D;background:#FFF6E3;border-radius:10px;color:#4A3305}
.ask .askq{display:flex;gap:7px;font-size:13.5px}
.ask .askq b{color:var(--warn)}
.askb{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.askb button{border:1px solid #C8964A;background:#fff;border-radius:8px;padding:5px 10px;font-size:13px;color:#4A3305}
.askb button:hover{background:#FFEFCC}
.ask.done{background:transparent;border-color:var(--rule);color:var(--muted)}
.askd{font-size:12.5px;margin-top:3px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ask:not(.done){background:#3A2E14;color:#F3DDB0;border-color:#7A5A20}:root:not([data-theme="light"]) .askb button{background:#2A2210;color:#F3DDB0}}
/* animazioni */
body.anim #log .entry.latest{animation:slidein .32s ease-out}
body.anim .ask:not(.done){animation:askin .45s cubic-bezier(.2,1.3,.4,1)}
body.anim .send:active,body.anim .zb:active,body.anim .fchip:active,body.anim .quick button:active{transform:scale(.96)}
body.anim .fchip,body.anim .zb,body.anim .send{transition:transform .12s,background-color .2s,border-color .2s}
body.anim #toast:not([hidden]){animation:slidein .25s ease-out}
body.anim #legend .lgi{animation:fadein .4s ease-out}
@keyframes slidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes askin{0%{opacity:0;transform:scale(.96)}100%{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){body.anim *{animation:none!important;transition:none!important}}
/* AI */
.tools{align-items:center}
.tools .sp{flex:1}
@media (min-width:960px){#logbtn{display:none}}
.aibtn{display:inline-flex;align-items:center;gap:6px}
.aidot{width:8px;height:8px;border-radius:50%;background:var(--rule);display:inline-block}
.aibtn.on{border-color:#7B5CC4;color:#5B3FA8;background:#F1ECFB}
.aibtn.on .aidot{background:#7B5CC4;box-shadow:0 0 0 0 rgba(123,92,196,.5)}
body.anim .aibtn.on .aidot{animation:aipulse 2s infinite}
@keyframes aipulse{0%{box-shadow:0 0 0 0 rgba(123,92,196,.55)}70%{box-shadow:0 0 0 7px rgba(123,92,196,0)}100%{box-shadow:0 0 0 0 rgba(123,92,196,0)}}
.it.ai b{color:#7B5CC4}.it.ai span{color:#5B3FA8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .aibtn.on{background:#2A2140;color:#CBB8F5;border-color:#6A52B0}:root:not([data-theme="light"]) .it.ai span{color:#CBB8F5}}
.entry.aientry{border-left:3px solid #B9A6EA;padding-left:8px}
.thinking .shimmer{background:linear-gradient(90deg,#7B5CC4 0%,#C9B8F2 40%,#7B5CC4 80%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 1.6s linear infinite}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.dots i{font-style:normal;animation:blink 1.2s infinite both}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
body.ai-busy .send{background:#7B5CC4}
body.ai-busy #cmd{border-color:#B9A6EA}
#aidlg{position:fixed;inset:0;z-index:50;background:rgba(8,14,20,.38);display:grid;place-items:center;padding:16px}
#aidlg[hidden]{display:none}
.aibox{width:min(500px,100%);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:0 20px 60px rgba(8,14,20,.3)}
.aibox .edbody label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.aibox .edbody label.chk{flex-direction:row;align-items:center;font-size:15px;color:var(--ink)}
.aibox input:not([type=checkbox]),.aibox select{border:1px solid var(--rule);background:var(--surface2);border-radius:8px;padding:8px 10px;font-size:14.5px;color:var(--ink);width:100%}
.aibox .privacy{border-left:3px solid var(--accent);padding-left:8px}
body.anim .aibox{animation:askin .3s cubic-bezier(.2,1.3,.4,1)}
/* altre animazioni */
body.anim #sheet.flash{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.35;transform:scale(.995)}100%{opacity:1;transform:none}}
body.anim #log .entry:nth-child(2){animation:fadein .5s ease-out}
body.anim #emptyhint em{animation:float 4s ease-in-out infinite}
body.anim #emptyhint em:nth-of-type(2){animation-delay:1.2s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
body.anim .fchip.on,body.anim .zb.on{animation:bump .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{0%{transform:scale(.9)}100%{transform:scale(1)}}
body.anim details.blk[open]>*:not(summary){animation:slidein .25s ease-out}
body.anim .zoom button:active,body.anim .icon:active,body.anim .chipbtn:active{transform:scale(.92)}
body.anim .icon,body.anim .chipbtn,body.anim .zoom button{transition:transform .12s,background-color .2s}
body.anim .brand svg{transition:transform .5s cubic-bezier(.2,1.5,.4,1)}
body.anim .brand:hover svg{transform:rotate(-8deg) scale(1.08)}
body.anim #editor .crow{animation:fadein .3s ease-out}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:10px;font-size:14px;max-width:90%}

/* --- genetica: trasmissione, avvisi, citogenetica --- */
.lgi .inh{font-style:normal;font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--rule);border-radius:5px;padding:0 4px;margin-left:5px}
.lgkey{color:var(--muted);gap:5px}
.lgwarn{cursor:pointer;color:#8A5400;font-weight:700}
.lgwarn b{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#E8A33D;color:#fff;font-size:11px}
.warnlist{flex-basis:100%;display:flex;flex-direction:column;gap:4px;margin-top:4px}
.warnlist button{text-align:left;border:1px solid #EBC58C;background:#FFF6E3;color:#5C3A06;border-radius:8px;padding:6px 9px;font-size:12.5px}
.warnlist button:hover{background:#FFEFCC}
.crow.wrap{flex-wrap:wrap}
.crow2{flex-basis:100%;display:flex;align-items:center;gap:10px;padding-left:30px}
.crow2 .inhsel{flex:1;min-width:0;font-size:13px;padding:5px 6px}
label.dn{display:inline-flex;flex-direction:row!important;align-items:center;gap:5px;font-size:13px;color:var(--ink)!important;white-space:nowrap}
.it.tip b{color:#3D5A99;font-family:Georgia,serif;font-style:italic}
.it.tip span{color:var(--ink)}
.entry .it.tip{background:rgba(61,90,153,.07);border-radius:6px;padding:3px 4px;margin:2px 0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .warnlist button{background:#3A2E14;color:#F3DDB0;border-color:#7A5A20}:root:not([data-theme="light"]) .it.tip b{color:#93A9E0}}
body.anim .wbadge{animation:fadein .4s ease-out}

/* --- 1.5: portatori multipli, Indietro, risposte --- */
.cbtns{display:flex;gap:8px;align-items:flex-end}
.back{height:46px;padding:0 14px;border:1px solid var(--rule);border-radius:12px;background:var(--surface);color:var(--ink);font-weight:600;white-space:nowrap}
.back:hover{border-color:var(--accent);color:var(--accent)}
@media (min-width:960px){ .cbtns{align-self:flex-end} }
.undolink{margin-left:8px;border:0;background:transparent;color:var(--accent);font-size:12px;font-weight:600;padding:0 2px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.entry.annullata .cmd{text-decoration:line-through;opacity:.65}
.it.ans b{color:var(--accent)} .it.ans span{color:var(--muted)}
.hgvs{display:block;font:11.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted);margin-top:1px}
.dot.half{background:linear-gradient(to top right,var(--c) 50%,#FFFFFF 50%);border:1px solid #1B2433}
.pmore{font-size:11px;fill:#4A5563;font-weight:700}
@media (max-width:600px){ .back .bt{display:none} .back{padding:0 13px;font-size:18px} }

/* --- 1.6: note generali, riferimento --- */
#povchip{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 12px 0;padding:7px 8px 7px 12px;border:1px dashed var(--accent);border-radius:10px;background:var(--accent-soft);color:var(--ink);font-size:13.5px}
#povchip[hidden]{display:none}
#povchip .small{padding:4px 9px;font-size:12.5px}
.povring{fill:none;stroke:var(--accent,#0E6E6B);stroke-width:2;stroke-dasharray:5 4}
.povrow{padding:0 16px 4px}
.tag.pov{background:#FFF4DD;color:#7A4B00}
.notegen{cursor:pointer}
.notegen:hover .fn{text-decoration:underline}


#m-new{display:none!important}
#code{display:none}
#ta-back{white-space:nowrap}
.ta-titolo{border:0;background:transparent;font:inherit;font-weight:700;color:var(--ink);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1;padding:6px 8px;border-radius:8px}
.ta-titolo:hover{background:var(--surface2)}
#tab-arch{position:fixed;inset:0;z-index:40;overflow:auto;background:var(--bg);padding-bottom:40px}
#tab-arch[hidden]{display:none}
.ta-head{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--rule)}
.ta-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.ta-brand em{font-style:normal;color:var(--accent)}
.ta-rete{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.ta-rete.off{background:#FFF4DD;color:#7A4B00}
.ta-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:16px 18px 6px}
.ta-top h1{font-size:20px;margin:0;flex:1 1 220px}
.ta-top h1 small{font-size:13px;font-weight:400;color:var(--muted);margin-left:8px}
.ta-daesp.warn{color:#7A4B00!important;font-weight:700!important}
#ta-q{flex:2 1 260px;height:44px;border:1px solid var(--rule);border-radius:12px;padding:0 14px;font:inherit;background:var(--surface);color:var(--ink)}
.ta-azioni{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 18px}
.ta-azioni .ghost,.ta-azioni .send{height:42px}
.ta-sp{flex:1}
#ta-nsel{font-size:13px;color:var(--muted)}
#ta-elenco{padding:4px 18px;display:grid;gap:8px}
.ta-riga{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.ta-riga.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ta-chk{display:flex;align-items:center;padding:0 14px;border-right:1px solid var(--rule);cursor:pointer}
.ta-chk input{width:24px;height:24px;accent-color:var(--accent)}
.ta-apri{flex:1;display:grid;grid-template-columns:minmax(110px,auto) 1fr auto;grid-template-areas:"cod nome badge" "cond cond cond" "meta meta meta";gap:3px 14px;text-align:left;border:0;background:transparent;font:inherit;color:inherit;padding:12px 14px;cursor:pointer;min-height:64px}
.ta-apri:hover{background:var(--surface2)}
.ta-cod{grid-area:cod;font-weight:700}
.ta-nome{grid-area:nome}.ta-nome small{color:var(--muted);margin-left:6px}
.ta-cond{grid-area:cond}
.ta-meta{grid-area:meta;font-size:12.5px;color:var(--muted)}
.ta-badge{grid-area:badge;font-size:12px;border-radius:999px;padding:2px 10px;align-self:start;white-space:nowrap}
.ta-badge.da{background:#FFF4DD;color:#7A4B00;border:1px solid #EBC58C}
.ta-badge.ok{background:var(--accent-soft);color:var(--accent)}
.chip{display:inline-block;font-size:12px;border-radius:6px;padding:1px 7px;margin:0 4px 3px 0;background:var(--surface2);border:1px solid var(--rule)}
.ta-vuoto{padding:30px 10px;text-align:center;color:var(--muted)}
.ta-nota{padding:10px 18px;font-size:13px;color:var(--muted);max-width:900px}
#ta-dlg{position:fixed;inset:0;z-index:60;background:rgba(8,14,20,.38);display:grid;place-items:center;padding:16px}
#ta-dlg[hidden]{display:none}
.ta-box{background:var(--surface);color:var(--ink);border-radius:16px;width:min(560px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.ta-bh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--rule)}
.ta-bb{padding:14px 16px;display:grid;gap:10px}
.ta-bb label,.ta-form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.ta-bb input:not([type=checkbox]),.ta-bb select,.ta-bb textarea{height:42px;border:1px solid var(--rule);border-radius:10px;padding:0 10px;font:inherit;color:var(--ink);background:var(--surface)}
.ta-bb textarea{height:auto;padding:8px 10px}
.ta-form{display:grid;gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ta-bb .chk{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;flex-wrap:wrap}
.acts .send,.acts .ghost,.acts .danger{height:44px}
.danger{border:1px solid var(--err,#B3261E);color:var(--err,#B3261E);background:transparent;border-radius:12px;padding:0 16px;font-weight:700}
.err{color:var(--err,#B3261E);margin:0}
.ta-imp{display:grid;gap:6px;max-height:50vh;overflow:auto}
.ta-imp-r{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--rule);border-radius:10px;padding:8px 10px}
.ta-imp-r small{display:block;color:var(--muted)} .ta-imp-r small.warn{color:#7A4B00}
body.in-archivio{overflow:hidden}

header,.ta-head{padding-top:max(10px,env(safe-area-inset-top))!important}
#composer{padding-bottom:max(12px,env(safe-area-inset-bottom))!important}
#tab-arch{padding-bottom:max(40px,env(safe-area-inset-bottom))}
header,.ta-head,#tab-arch,#composer{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
@supports (-webkit-touch-callout: none){ input,textarea,select{font-size:16px!important} }
@media (max-width:480px){ .ta-azioni .ghost,.ta-azioni .send{flex:1 1 45%} .ta-top h1 small{display:block;margin:2px 0 0} #ta-back{padding:6px 8px} }
@media (max-width:640px){ .g2{grid-template-columns:1fr} .ta-apri{grid-template-columns:1fr;grid-template-areas:"cod" "nome" "badge" "cond" "meta"} }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand" aria-label="Pedigree">
      <svg width="26" height="22" viewBox="0 0 26 22" aria-hidden="true"><rect x="1" y="1" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="21" cy="5" r="4" fill="currentColor"/><path d="M9 5h8M13 5v8M5 13h16M5 13v3M21 13v3" stroke="currentColor" stroke-width="1.6" fill="none"/><circle cx="5" cy="19" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="18.4" y="16.4" width="5.2" height="5.2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      <span>Pedigree</span>
    </div>
    <input id="code" placeholder="Codice consulenza" aria-label="Codice consulenza" autocomplete="off">
    <div class="hbtns">
      <button class="icon" id="undo" aria-label="Annulla" title="Annulla"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5L3 9l4 4M3 9h9a5 5 0 010 10h-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="icon" id="redo" aria-label="Ripeti" title="Ripeti"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M13 5l4 4-4 4M17 9H8a5 5 0 000 10h2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="icon" id="menubtn" aria-label="Menu file" aria-haspopup="true" aria-expanded="false" title="File"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <div id="menu" hidden role="menu">
        <button class="dl" id="m-png" role="menuitem">Salva immagine PNG</button>
        <button class="dl" id="m-svg" role="menuitem">Salva disegno SVG</button>
        <button class="dl" id="m-json" role="menuitem">Salva pedigree (.json)</button>
        <button id="m-open" role="menuitem">Apri pedigree salvato…</button>
        <button id="m-anim" role="menuitem">Animazioni: attive</button>
        <hr>
        <button id="m-new" role="menuitem">Nuovo pedigree</button>
      </div>
      <input type="file" id="filein" accept=".json,application/json" hidden>
    </div>
  </header>

  <main id="stagewrap">
    <div id="stage"><div id="legend" hidden></div><div id="sheet"></div></div>
    <div id="emptyhint">
      <p>Descrivi la famiglia come la racconteresti in consulenza.</p>
      <em>probanda di 34 anni affetta da carcinoma mammario a 32 anni</em>
      <em>aggiungi tre sorelle, una zia paterna e un nonno materno affetto da tumore del colon</em>
    </div>
    <div class="zoom" role="group" aria-label="Zoom">
      <button id="zout" aria-label="Riduci">−</button><span id="zoomval">100%</span><button id="zin" aria-label="Ingrandisci">+</button><button id="zfit">Adatta</button>
    </div>
  </main>

  <section id="panel" aria-label="Comandi">
    <div id="log" aria-live="polite"></div>
    <div class="tools">
      <button type="button" class="chipbtn" id="exbtn">Esempi</button><button type="button" class="chipbtn" id="notebtn" title="Note generali in basso a sinistra dell’albero">Note</button>
      <button type="button" class="chipbtn" id="logbtn">Registro</button>
      <span class="sp"></span>
      <button type="button" class="chipbtn aibtn" id="aibtn" aria-pressed="false" title="Interpretazione con AI"><span class="aidot"></span>AI spenta</button>
      <button type="button" class="chipbtn" id="aiset" aria-label="Impostazioni AI" title="Impostazioni AI">⚙</button>
    </div>
    <div id="examples">
      <button type="button" data-ex="probanda di 34 anni affetta da carcinoma mammario a 32 anni">probanda di 34 anni affetta da…</button>
      <button type="button" data-ex="aggiungi tre sorelle, una zia paterna e un nonno materno affetto da tumore del colon">aggiungi tre sorelle, una zia paterna…</button>
      <button type="button" data-ex="il padre ha due fratelli, uno deceduto a 50 anni per infarto">il padre ha due fratelli, uno deceduto…</button>
      <button type="button" data-ex="la madre ha avuto due aborti spontanei">la madre ha avuto due aborti</button>
      <button type="button" data-ex="la zia paterna ha una figlia portatrice di BRCA1">una figlia portatrice di BRCA1</button>
      <button type="button" data-ex="i genitori sono cugini primi">i genitori sono cugini primi</button>
      <button type="button" data-ex="la seconda sorella è deceduta a 20 anni">la seconda sorella è deceduta…</button>
      <button type="button" data-ex="chi ha il tumore al retto ha BRCA1 c.68_69del come la madre">chi ha … ha BRCA1 c.68_69del come la madre</button>
      <button type="button" data-ex="il padre è portatore di fibrosi cistica e di talassemia">portatore di due condizioni</button>
      <button type="button" data-ex="la sorella maggiore è negativa al test per BRCA1">negativa al test per BRCA1</button>
      <button type="button" data-ex="lo zio paterno è affetto dalla stessa malattia del probando">stessa malattia del probando</button>
      <button type="button" data-ex="la zia materna ha due figlie di cui una affetta">due figlie di cui una affetta</button>
      <button type="button" data-ex="la madre è eterozigote per la stessa mutazione">eterozigote per la stessa mutazione</button>
      <button type="button" data-ex="il probando e la sorella sono gemelli monozigoti">gemelli monozigoti</button>
      <button type="button" data-ex="il nonno paterno è fratello della nonna materna">nonni fratelli (consanguineità)</button>
      <button type="button" data-ex="la madre ha un figlio da un precedente matrimonio">figlio da un precedente matrimonio</button>
      <button type="button" data-ex="la variante del probando è CFTR F508del">la variante del probando è…</button>
      <button type="button" data-ex="il padre è portatore sano della variante familiare">portatore sano della variante familiare</button>
      <button type="button" data-ex="il padre non è portatore">il padre non è portatore</button>
      <button type="button" data-ex="il probando ha due gemelle monozigoti">ha due gemelle (figlie)</button>
      <button type="button" data-ex="il fratello ha la variante ereditata dalla madre">ereditata dalla madre</button>
      <button type="button" data-ex="nonna mat. deceduta K mammella 60 aa">nonna mat. deceduta K mammella 60 aa</button>
      <button type="button" data-ex="padre 42 aa iperteso e diabetico">padre 42 aa iperteso e diabetico</button>
      <button type="button" data-ex="la madre è microcitemica">la madre è microcitemica</button>
      <button type="button" data-ex="la madre ha avuto una IVG e un aborto spontaneo">una IVG e un aborto spontaneo</button>
      <button type="button" data-ex="zia paterna sposata, 2 figli sani">zia paterna sposata, 2 figli sani</button>
      <button type="button" data-ex="togli la talassemia alla madre">togli la talassemia alla madre</button>
      <button type="button" data-ex="rimuovi la terza sorella">rimuovi la terza sorella</button>
    </div>
    <form id="composer" autocomplete="off">
      <textarea id="cmd" rows="1" placeholder="Scrivi chi aggiungere o modificare…" aria-label="Comando" enterkeyhint="send"></textarea>
      <div class="cbtns"><button class="back" type="button" id="indietro" title="Annulla l’ultima frase e rimettila nella casella per correggerla" aria-label="Indietro: annulla l’ultima frase">↶<span class="bt"> Indietro</span></button><button class="send" type="submit">Applica</button></div>
    </form>
  </section>
</div>
<div id="scrim" hidden></div>
<aside id="editor" hidden aria-label="Modifica persona"></aside>
<div id="toast" hidden role="status"></div>
<div id="aidlg" hidden></div>
<script src="engine.js"></script>
<script src="ai.js"></script>
<script src="editor.js"></script>
<script src="tablet.js"></script>
</body>
</html>
